<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calm Intelligence</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <style>
        /* Register CSS custom properties for smooth color transitions */
        @property --color-1 {
            syntax: '<color>';
            inherits: false;
            initial-value: #0B1120;
        }

        @property --color-2 {
            syntax: '<color>';
            inherits: false;
            initial-value: #1A1F3A;
        }

        @property --color-3 {
            syntax: '<color>';
            inherits: false;
            initial-value: #0F1729;
        }

        @property --color-4 {
            syntax: '<color>';
            inherits: false;
            initial-value: #1e3a8a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Grain texture filter */
        svg {
            position: fixed;
            width: 0;
            height: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #0B1120;
            position: relative;

            /* CSS Custom Properties for gradient colors with smooth transitions */
            --color-1: #0B1120;
            --color-2: #1A1F3A;
            --color-3: #0F1729;
            --color-4: #1e3a8a;

            /* Mouse interaction offset properties */
            --offset-x: 0%;
            --offset-y: 0%;

            transition:
                --color-1 180s cubic-bezier(0.4, 0, 0.2, 1),
                --color-2 180s cubic-bezier(0.4, 0, 0.2, 1),
                --color-3 180s cubic-bezier(0.4, 0, 0.2, 1),
                --color-4 180s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Animated liquid gradient background */
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background:
                radial-gradient(circle at calc(20% + var(--offset-x)) calc(30% + var(--offset-y)), var(--color-1), transparent 50%),
                radial-gradient(circle at calc(80% - var(--offset-x)) calc(20% + var(--offset-y)), var(--color-2), transparent 50%),
                radial-gradient(circle at calc(40% + var(--offset-x) * 0.5) calc(70% - var(--offset-y)), var(--color-3), transparent 50%),
                radial-gradient(circle at calc(60% - var(--offset-x) * 0.5) calc(50% + var(--offset-y) * 0.5), var(--color-4), transparent 50%),
                linear-gradient(135deg, var(--color-1), var(--color-3));
            animation:
                drift1 120s ease-in-out infinite,
                drift2 140s ease-in-out infinite,
                drift3 160s ease-in-out infinite;
            z-index: 0;
            transition: opacity 3s ease;
        }

        body.loaded::before {
            transition: opacity 180s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Keyframe animations for liquid movement */
        @keyframes drift1 {
            0%, 100% { transform: translate(0%, 0%) rotate(0deg); }
            33% { transform: translate(-5%, 5%) rotate(3deg); }
            66% { transform: translate(5%, -3%) rotate(-2deg); }
        }

        @keyframes drift2 {
            0%, 100% { transform: translate(0%, 0%) scale(1); }
            50% { transform: translate(3%, 4%) scale(1.05); }
        }

        @keyframes drift3 {
            0%, 100% { transform: translate(0%, 0%); }
            25% { transform: translate(4%, -4%); }
            50% { transform: translate(-3%, 3%); }
            75% { transform: translate(2%, -2%); }
        }

        /* Grain texture overlay */
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            opacity: 0.015;
            pointer-events: none;
            mix-blend-mode: overlay;
            z-index: 1;
        }

        .title {
            font-size: clamp(2rem, 8vw, 5rem);
            font-variation-settings: 'wght' 200;
            letter-spacing: 0.02em;
            color: rgba(255, 255, 255, 0.95);
            text-align: center;
            margin-bottom: 1rem;
            transition: color 3s ease, font-variation-settings 3s ease;
            position: relative;
            z-index: 10;
        }

        .tagline {
            font-family: 'SF Mono', 'Monaco', 'Inconsolata', 'Roboto Mono', monospace;
            font-size: clamp(0.85rem, 1.8vw, 1rem);
            font-weight: 400;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 0.05em;
            transition: color 3s ease;
            text-align: center;
            position: relative;
            z-index: 10;
        }

        .phase {
            position: fixed;
            bottom: 1.5rem;
            right: 2rem;
            font-size: 0.7rem;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.3);
            letter-spacing: 0.2em;
            text-transform: lowercase;
            transition: color 3s ease;
            z-index: 10;
        }

        @media (max-width: 768px) {
            .phase {
                bottom: 1rem;
                right: 1.5rem;
                font-size: 0.65rem;
            }
        }
    </style>
</head>
<body>
    <div class="title">Calm Intelligence</div>
    <div class="tagline" id="elevation">Calculating...</div>
    <div class="phase" id="phase"></div>

    <script>
        // Default location: Toronto, Ontario
        const DEFAULT_LOCATION = {
            lat: 43.6532,
            lng: -79.3832,
            name: 'Toronto'
        };

        // Animated mesh gradient definitions with 4 circles
        const GRADIENTS = {
            night: {
                colors: ['#0B1120', '#1A1F3A', '#0F1729', '#1e3a8a'],
                textColor: 'rgba(255, 255, 255, 0.95)',
                taglineColor: 'rgba(255, 255, 255, 0.5)',
                phaseColor: 'rgba(255, 255, 255, 0.3)'
            },
            dawn: {
                colors: ['#1e1b4b', '#3730a3', '#7e22ce', '#581c87'],
                textColor: 'rgba(255, 255, 255, 0.95)',
                taglineColor: 'rgba(255, 255, 255, 0.5)',
                phaseColor: 'rgba(255, 255, 255, 0.3)'
            },
            sunrise: {
                colors: ['#7e22ce', '#dc2626', '#f59e0b', '#ec4899'],
                textColor: 'rgba(255, 255, 255, 0.95)',
                taglineColor: 'rgba(255, 255, 255, 0.6)',
                phaseColor: 'rgba(255, 255, 255, 0.4)'
            },
            morning: {
                colors: ['#0ea5e9', '#38bdf8', '#7dd3fc', '#06b6d4'],
                textColor: 'rgba(255, 255, 255, 0.95)',
                taglineColor: 'rgba(255, 255, 255, 0.6)',
                phaseColor: 'rgba(255, 255, 255, 0.4)'
            },
            midday: {
                colors: ['#0891b2', '#06b6d4', '#22d3ee', '#14b8a6'],
                textColor: 'rgba(255, 255, 255, 0.95)',
                taglineColor: 'rgba(255, 255, 255, 0.6)',
                phaseColor: 'rgba(255, 255, 255, 0.4)'
            },
            afternoon: {
                colors: ['#38bdf8', '#60a5fa', '#fbbf24', '#3b82f6'],
                textColor: 'rgba(255, 255, 255, 0.95)',
                taglineColor: 'rgba(255, 255, 255, 0.55)',
                phaseColor: 'rgba(255, 255, 255, 0.35)'
            },
            goldenHour: {
                colors: ['#f59e0b', '#f97316', '#fb923c', '#ea580c'],
                textColor: 'rgba(255, 255, 255, 0.95)',
                taglineColor: 'rgba(255, 255, 255, 0.6)',
                phaseColor: 'rgba(255, 255, 255, 0.4)'
            },
            sunset: {
                colors: ['#dc2626', '#e11d48', '#9333ea', '#be123c'],
                textColor: 'rgba(255, 255, 255, 0.95)',
                taglineColor: 'rgba(255, 255, 255, 0.6)',
                phaseColor: 'rgba(255, 255, 255, 0.4)'
            },
            dusk: {
                colors: ['#6366f1', '#4f46e5', '#2e1065', '#7c3aed'],
                textColor: 'rgba(255, 255, 255, 0.95)',
                taglineColor: 'rgba(255, 255, 255, 0.5)',
                phaseColor: 'rgba(255, 255, 255, 0.3)'
            }
        };

        let currentLocation = null;
        let sunData = null;
        let isFirstLoad = true;

        // Check localStorage for cached sun data
        function checkCachedData() {
            const cached = localStorage.getItem('sunData');
            const cachedLocation = localStorage.getItem('location');

            if (cached && cachedLocation) {
                try {
                    sunData = JSON.parse(cached);
                    // Convert string dates back to Date objects
                    sunData.sunrise = new Date(sunData.sunrise);
                    sunData.sunset = new Date(sunData.sunset);
                    sunData.solarNoon = new Date(sunData.solarNoon);
                    sunData.civilTwilightBegin = new Date(sunData.civilTwilightBegin);
                    sunData.civilTwilightEnd = new Date(sunData.civilTwilightEnd);

                    currentLocation = JSON.parse(cachedLocation);

                    // Check if data is from today
                    const cachedDate = new Date(sunData.sunrise).toDateString();
                    const today = new Date().toDateString();

                    if (cachedDate === today) {
                        updateGradient();
                        updateSolarElevation();
                        return true;
                    }
                } catch (e) {
                    console.error('Error parsing cached data:', e);
                }
            }
            return false;
        }

        // Get user's location
        function getLocation() {
            if ('geolocation' in navigator) {
                navigator.geolocation.getCurrentPosition(
                    position => {
                        currentLocation = {
                            lat: position.coords.latitude,
                            lng: position.coords.longitude
                        };
                        localStorage.setItem('location', JSON.stringify(currentLocation));
                        fetchSunData();
                    },
                    error => {
                        console.log('Geolocation denied, using default location');
                        currentLocation = DEFAULT_LOCATION;
                        localStorage.setItem('location', JSON.stringify(currentLocation));
                        fetchSunData();
                    }
                );
            } else {
                currentLocation = DEFAULT_LOCATION;
                localStorage.setItem('location', JSON.stringify(currentLocation));
                fetchSunData();
            }
        }

        // Fetch sunrise/sunset data
        async function fetchSunData() {
            try {
                const response = await fetch(
                    `https://api.sunrise-sunset.org/json?lat=${currentLocation.lat}&lng=${currentLocation.lng}&formatted=0`
                );
                const data = await response.json();

                if (data.status === 'OK') {
                    sunData = {
                        sunrise: new Date(data.results.sunrise),
                        sunset: new Date(data.results.sunset),
                        solarNoon: new Date(data.results.solar_noon),
                        civilTwilightBegin: new Date(data.results.civil_twilight_begin),
                        civilTwilightEnd: new Date(data.results.civil_twilight_end)
                    };

                    // Cache sun data
                    localStorage.setItem('sunData', JSON.stringify(sunData));

                    updateGradient();
                    updateSolarElevation();

                    // Update every minute
                    setInterval(() => {
                        updateGradient();
                        updateSolarElevation();
                    }, 60000);
                } else {
                    throw new Error('Failed to fetch sun data');
                }
            } catch (error) {
                console.error('Error fetching sun data:', error);
            }
        }

        // Calculate current phase of day
        function getCurrentPhase() {
            if (!sunData) return 'night';

            const now = new Date();
            const currentTime = now.getTime();

            const { sunrise, sunset, civilTwilightBegin, civilTwilightEnd } = sunData;

            const dawnStart = civilTwilightBegin.getTime();
            const dawnEnd = sunrise.getTime() - (30 * 60 * 1000);
            const sunriseStart = dawnEnd;
            const sunriseEnd = sunrise.getTime() + (30 * 60 * 1000);
            const morningEnd = sunrise.getTime() + (3 * 60 * 60 * 1000);

            const afternoonStart = sunset.getTime() - (4 * 60 * 60 * 1000);
            const goldenHourStart = sunset.getTime() - (90 * 60 * 1000);
            const sunsetStart = sunset.getTime() - (30 * 60 * 1000);
            const sunsetEnd = sunset.getTime() + (30 * 60 * 1000);
            const duskEnd = civilTwilightEnd.getTime();

            if (currentTime >= dawnStart && currentTime < dawnEnd) {
                return 'dawn';
            } else if (currentTime >= sunriseStart && currentTime < sunriseEnd) {
                return 'sunrise';
            } else if (currentTime >= sunriseEnd && currentTime < morningEnd) {
                return 'morning';
            } else if (currentTime >= morningEnd && currentTime < afternoonStart) {
                return 'midday';
            } else if (currentTime >= afternoonStart && currentTime < goldenHourStart) {
                return 'afternoon';
            } else if (currentTime >= goldenHourStart && currentTime < sunsetStart) {
                return 'goldenHour';
            } else if (currentTime >= sunsetStart && currentTime < sunsetEnd) {
                return 'sunset';
            } else if (currentTime >= sunsetEnd && currentTime < duskEnd) {
                return 'dusk';
            } else {
                return 'night';
            }
        }

        // Calculate solar elevation angle
        function calculateSolarElevation() {
            if (!sunData || !currentLocation) return null;

            const now = new Date();
            const lat = currentLocation.lat * Math.PI / 180; // Convert to radians
            const lng = currentLocation.lng;

            // Calculate day of year
            const start = new Date(now.getFullYear(), 0, 0);
            const diff = now - start;
            const oneDay = 1000 * 60 * 60 * 24;
            const dayOfYear = Math.floor(diff / oneDay);

            // Solar declination (simplified)
            const declination = -23.44 * Math.cos((360 / 365) * (dayOfYear + 10) * Math.PI / 180);
            const declinationRad = declination * Math.PI / 180;

            // Hour angle
            const hours = now.getHours() + now.getMinutes() / 60;
            const hourAngle = (hours - 12) * 15; // 15 degrees per hour
            const hourAngleRad = hourAngle * Math.PI / 180;

            // Solar elevation angle (altitude)
            const elevation = Math.asin(
                Math.sin(lat) * Math.sin(declinationRad) +
                Math.cos(lat) * Math.cos(declinationRad) * Math.cos(hourAngleRad)
            );

            return elevation * 180 / Math.PI; // Convert to degrees
        }

        // Update solar elevation display
        function updateSolarElevation() {
            const elevation = calculateSolarElevation();
            const elevationElement = document.getElementById('elevation');

            if (elevation !== null && elevationElement) {
                const sign = elevation >= 0 ? '+' : '';
                elevationElement.textContent = `Elevation ${sign}${elevation.toFixed(1)}°`;
            }
        }

        // Calculate dynamic font weight based on solar position
        function calculateFontWeight() {
            if (!sunData) return 200;

            const now = new Date();
            const currentTime = now.getTime();
            const sunrise = sunData.sunrise.getTime();
            const sunset = sunData.sunset.getTime();
            const solarNoon = sunData.solarNoon.getTime();

            // Night: weight 100-200
            if (currentTime < sunrise || currentTime > sunset) {
                return 200;
            }

            // Day: transition from 200 (sunrise) to 400 (noon) to 200 (sunset)
            if (currentTime <= solarNoon) {
                // Morning: 200 → 400
                const progress = (currentTime - sunrise) / (solarNoon - sunrise);
                return 200 + (progress * 200);
            } else {
                // Afternoon: 400 → 200
                const progress = (currentTime - solarNoon) / (sunset - solarNoon);
                return 400 - (progress * 200);
            }
        }

        // Update gradient based on current phase (Animated Liquid Gradient)
        function updateGradient() {
            const phase = getCurrentPhase();
            const gradient = GRADIENTS[phase];

            if (gradient) {
                // Update CSS custom properties for the 4 animated gradient circles
                document.body.style.setProperty('--color-1', gradient.colors[0]);
                document.body.style.setProperty('--color-2', gradient.colors[1]);
                document.body.style.setProperty('--color-3', gradient.colors[2]);
                document.body.style.setProperty('--color-4', gradient.colors[3]);

                // Update text colors
                const title = document.querySelector('.title');
                const tagline = document.querySelector('.tagline');
                const phaseElement = document.getElementById('phase');

                if (title) {
                    title.style.color = gradient.textColor;
                    // Update font weight based on solar cycle
                    const weight = calculateFontWeight();
                    title.style.fontVariationSettings = `'wght' ${weight}`;
                }

                if (tagline) tagline.style.color = gradient.taglineColor;

                // Update phase indicator
                const phaseNames = {
                    night: 'night',
                    dawn: 'dawn',
                    sunrise: 'sunrise',
                    morning: 'morning',
                    midday: 'midday',
                    afternoon: 'afternoon',
                    goldenHour: 'golden hour',
                    sunset: 'sunset',
                    dusk: 'dusk'
                };

                if (phaseElement) {
                    phaseElement.textContent = phaseNames[phase] || '';
                    phaseElement.style.color = gradient.phaseColor;
                }

                // Apply faster transition on first load
                if (isFirstLoad) {
                    document.body.classList.add('loaded');
                    isFirstLoad = false;
                }
            }
        }

        // Mouse tracking for interactive gradient movement
        let mouseX = 0;
        let mouseY = 0;
        let targetX = 0;
        let targetY = 0;
        let currentX = 0;
        let currentY = 0;
        let isMouseActive = false;
        let inactivityTimeout = null;

        // Smooth interpolation (lerp)
        function lerp(start, end, factor) {
            return start + (end - start) * factor;
        }

        // Track mouse movement
        document.addEventListener('mousemove', (e) => {
            // Normalize mouse position to -1 to 1 range
            mouseX = (e.clientX / window.innerWidth) * 2 - 1;
            mouseY = (e.clientY / window.innerHeight) * 2 - 1;

            // Scale down the effect (subtle movement)
            targetX = mouseX * 3; // 3% max offset
            targetY = mouseY * 3;

            isMouseActive = true;

            // Reset inactivity timeout
            clearTimeout(inactivityTimeout);
            inactivityTimeout = setTimeout(() => {
                isMouseActive = false;
            }, 2000); // 2 seconds of no movement = drift back to center
        });

        // Mouse leaves viewport = drift back to center
        document.addEventListener('mouseleave', () => {
            isMouseActive = false;
            targetX = 0;
            targetY = 0;
        });

        // Animation loop for smooth gradient movement
        function animateGradient() {
            // If mouse is inactive, drift back to center
            if (!isMouseActive) {
                targetX = lerp(targetX, 0, 0.02); // Very slow drift back
                targetY = lerp(targetY, 0, 0.02);
            }

            // Smooth interpolation with inertia
            currentX = lerp(currentX, targetX, 0.08); // 8% interpolation = smooth lag
            currentY = lerp(currentY, targetY, 0.08);

            // Apply transform to gradient background
            const gradientLayer = document.body;
            if (gradientLayer) {
                gradientLayer.style.setProperty('--offset-x', `${currentX}%`);
                gradientLayer.style.setProperty('--offset-y', `${currentY}%`);
            }

            requestAnimationFrame(animateGradient);
        }

        // Start animation loop
        animateGradient();

        // Initialize
        const hasCachedData = checkCachedData();

        if (!hasCachedData) {
            getLocation();
        } else {
            // Still fetch fresh data in background
            getLocation();
            // Set up interval for updates
            setInterval(() => {
                updateGradient();
                updateSolarElevation();
            }, 60000);
        }
    </script>
</body>
</html>
