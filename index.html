<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hardy Concert Countdown</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <style>
        /* Register CSS custom properties for smooth color transitions */
        @property --color-1 {
            syntax: '<color>';
            inherits: false;
            initial-value: #0B1120;
        }

        @property --color-2 {
            syntax: '<color>';
            inherits: false;
            initial-value: #1A1F3A;
        }

        @property --color-3 {
            syntax: '<color>';
            inherits: false;
            initial-value: #0F1729;
        }

        @property --color-4 {
            syntax: '<color>';
            inherits: false;
            initial-value: #1e3a8a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Grain texture filter */
        svg {
            position: fixed;
            width: 0;
            height: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #0B1120;
            position: relative;

            /* CSS Custom Properties for gradient colors with smooth transitions */
            --color-1: #0B1120;
            --color-2: #1A1F3A;
            --color-3: #0F1729;
            --color-4: #1e3a8a;

            /* Mouse interaction offset properties */
            --offset-x: 0%;
            --offset-y: 0%;

            transition:
                --color-1 180s cubic-bezier(0.4, 0, 0.2, 1),
                --color-2 180s cubic-bezier(0.4, 0, 0.2, 1),
                --color-3 180s cubic-bezier(0.4, 0, 0.2, 1),
                --color-4 180s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Animated liquid gradient background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(circle 800px at calc(20% + var(--offset-x)) calc(30% + var(--offset-y)), var(--color-1), transparent 70%),
                radial-gradient(circle 800px at calc(80% - var(--offset-x)) calc(20% + var(--offset-y)), var(--color-2), transparent 70%),
                radial-gradient(circle 900px at calc(40% + var(--offset-x) * 0.5) calc(70% - var(--offset-y)), var(--color-3), transparent 70%),
                radial-gradient(circle 700px at calc(60% - var(--offset-x) * 0.5) calc(50% + var(--offset-y) * 0.5), var(--color-4), transparent 70%),
                linear-gradient(135deg, var(--color-1), var(--color-3));
            z-index: 0;
            filter: blur(40px);
        }

        body.loaded::before {
            transition: opacity 180s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Grain texture overlay */
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            opacity: 0.015;
            pointer-events: none;
            mix-blend-mode: overlay;
            z-index: 1;
        }

        .title {
            font-size: clamp(3.5rem, 15vw, 10rem);
            font-variation-settings: 'wght' 800;
            letter-spacing: -0.02em;
            color: rgba(255, 255, 255, 1);
            text-align: center;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            transition: color 3s ease, font-variation-settings 3s ease;
            position: relative;
            z-index: 10;
            text-shadow:
                0 0 30px rgba(255, 255, 255, 0.3),
                0 0 60px rgba(255, 100, 100, 0.2),
                0 4px 40px rgba(0, 0, 0, 0.5);
        }

        .tour-name {
            font-size: clamp(0.9rem, 2.5vw, 1.3rem);
            font-variation-settings: 'wght' 700;
            letter-spacing: 0.3em;
            color: rgba(255, 255, 255, 0.9);
            text-align: center;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
            position: relative;
            z-index: 10;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        }

        .subtitle {
            font-size: clamp(0.85rem, 2vw, 1.1rem);
            font-variation-settings: 'wght' 500;
            letter-spacing: 0.1em;
            color: rgba(255, 255, 255, 0.75);
            text-align: center;
            margin-bottom: 0.3rem;
            position: relative;
            z-index: 10;
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.3);
        }

        .venue {
            font-size: clamp(1.2rem, 3.5vw, 2rem);
            font-variation-settings: 'wght' 600;
            letter-spacing: 0.05em;
            color: rgba(255, 255, 255, 0.95);
            text-align: center;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
            position: relative;
            z-index: 10;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
        }

        .supporting {
            font-size: clamp(0.75rem, 1.8vw, 1rem);
            font-variation-settings: 'wght' 400;
            letter-spacing: 0.15em;
            color: rgba(255, 255, 255, 0.6);
            text-align: center;
            text-transform: uppercase;
            margin-bottom: 3rem;
            position: relative;
            z-index: 10;
        }

        .tagline {
            font-family: 'SF Mono', 'Monaco', 'Inconsolata', 'Roboto Mono', monospace;
            font-size: clamp(1.5rem, 4vw, 3rem);
            font-weight: 600;
            color: rgba(255, 255, 255, 1);
            letter-spacing: 0.1em;
            transition: color 3s ease;
            text-align: center;
            position: relative;
            z-index: 10;
            font-variant-numeric: tabular-nums;
            text-shadow:
                0 0 20px rgba(255, 255, 255, 0.4),
                0 4px 30px rgba(0, 0, 0, 0.4);
            margin-bottom: 1rem;
        }

        .countdown-labels {
            font-family: 'Inter', sans-serif;
            font-size: clamp(0.7rem, 1.2vw, 0.9rem);
            font-weight: 300;
            letter-spacing: 0.2em;
            color: rgba(255, 255, 255, 0.6);
            text-transform: uppercase;
            text-align: center;
            position: relative;
            z-index: 10;
            margin-bottom: 3rem;
        }

        .spotify-button {
            display: inline-flex;
            align-items: center;
            gap: 0.8rem;
            padding: 1.1rem 2.8rem;
            background: rgba(30, 215, 96, 0.15);
            border: 2px solid rgba(30, 215, 96, 0.4);
            border-radius: 50px;
            color: rgba(255, 255, 255, 0.95);
            font-family: 'Inter', sans-serif;
            font-size: clamp(0.85rem, 1.8vw, 1rem);
            font-variation-settings: 'wght' 600;
            letter-spacing: 0.08em;
            text-decoration: none;
            text-transform: uppercase;
            position: relative;
            z-index: 10;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(10px);
            cursor: pointer;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
            white-space: nowrap;
        }

        .spotify-button:hover {
            background: rgba(30, 215, 96, 0.25);
            border-color: rgba(30, 215, 96, 0.6);
            transform: translateY(-2px);
            box-shadow:
                0 0 30px rgba(30, 215, 96, 0.3),
                0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .spotify-button:active {
            transform: translateY(0);
        }

        .spotify-icon {
            width: 22px;
            height: 22px;
            flex-shrink: 0;
            fill: currentColor;
        }

        @media (max-width: 768px) {
            .spotify-button {
                padding: 0.9rem 2rem;
                gap: 0.65rem;
                font-size: clamp(0.75rem, 3.5vw, 0.9rem);
            }

            .spotify-icon {
                width: 18px;
                height: 18px;
            }
        }

        .phase {
            position: fixed;
            bottom: 1.5rem;
            right: 2rem;
            font-size: 0.7rem;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.3);
            letter-spacing: 0.2em;
            text-transform: lowercase;
            transition: color 3s ease;
            z-index: 10;
        }

        @media (max-width: 768px) {
            .phase {
                bottom: 1rem;
                right: 1.5rem;
                font-size: 0.65rem;
            }
        }
    </style>
</head>
<body>
    <div class="title">HARDY</div>
    <div class="tour-name">Country! Country! Tour!</div>
    <div class="subtitle">February 7, 2026 • 7:00 PM</div>
    <div class="venue">Canada Life Place • London, ON</div>
    <div class="supporting">with Cameron Whitcomb & McCoy Moore</div>
    <div class="tagline" id="clock">00:00:00:00</div>
    <div class="countdown-labels">DAYS     HOURS     MINS     SECS</div>
    <a href="https://open.spotify.com/playlist/3a8aHwfyeGncejXinAN4Do" target="_blank" rel="noopener noreferrer" class="spotify-button">
        <svg class="spotify-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/>
        </svg>
        Listen to the Setlist
    </a>
    <div class="phase" id="phase"></div>

    <script>
        // Default location: Listowel, Ontario
        const DEFAULT_LOCATION = {
            lat: 43.7333,
            lng: -80.9500,
            name: 'Listowel'
        };

        // Country-themed warm gradient definitions
        const GRADIENTS = {
            night: {
                colors: ['#1a0f0a', '#2d1810', '#3d1f14', '#4a2618'],
                textColor: 'rgba(255, 255, 255, 1)',
                taglineColor: 'rgba(255, 255, 255, 1)',
                phaseColor: 'rgba(255, 255, 255, 0.4)'
            },
            dawn: {
                colors: ['#4a2618', '#6b3a1e', '#8b4513', '#a0522d'],
                textColor: 'rgba(255, 255, 255, 1)',
                taglineColor: 'rgba(255, 255, 255, 1)',
                phaseColor: 'rgba(255, 255, 255, 0.4)'
            },
            sunrise: {
                colors: ['#d2691e', '#e8701e', '#ff7f50', '#ff8c42'],
                textColor: 'rgba(255, 255, 255, 1)',
                taglineColor: 'rgba(255, 255, 255, 1)',
                phaseColor: 'rgba(255, 255, 255, 0.5)'
            },
            morning: {
                colors: ['#daa520', '#cd853f', '#d2691e', '#c47335'],
                textColor: 'rgba(255, 255, 255, 1)',
                taglineColor: 'rgba(255, 255, 255, 1)',
                phaseColor: 'rgba(255, 255, 255, 0.5)'
            },
            midday: {
                colors: ['#e6a84e', '#d4933e', '#c47d3a', '#b86f3a'],
                textColor: 'rgba(255, 255, 255, 1)',
                taglineColor: 'rgba(255, 255, 255, 1)',
                phaseColor: 'rgba(255, 255, 255, 0.5)'
            },
            afternoon: {
                colors: ['#cd853f', '#c47335', '#b8602e', '#a0522d'],
                textColor: 'rgba(255, 255, 255, 1)',
                taglineColor: 'rgba(255, 255, 255, 1)',
                phaseColor: 'rgba(255, 255, 255, 0.5)'
            },
            goldenHour: {
                colors: ['#ff8c42', '#ff7f50', '#e8701e', '#d2691e'],
                textColor: 'rgba(255, 255, 255, 1)',
                taglineColor: 'rgba(255, 255, 255, 1)',
                phaseColor: 'rgba(255, 255, 255, 0.5)'
            },
            sunset: {
                colors: ['#d2691e', '#c1440e', '#a0311e', '#8b2500'],
                textColor: 'rgba(255, 255, 255, 1)',
                taglineColor: 'rgba(255, 255, 255, 1)',
                phaseColor: 'rgba(255, 255, 255, 0.5)'
            },
            dusk: {
                colors: ['#8b4513', '#6b3410', '#4a2618', '#3d1f14'],
                textColor: 'rgba(255, 255, 255, 1)',
                taglineColor: 'rgba(255, 255, 255, 1)',
                phaseColor: 'rgba(255, 255, 255, 0.4)'
            }
        };

        let currentLocation = null;
        let sunData = null;
        let isFirstLoad = true;

        // Check localStorage for cached sun data
        function checkCachedData() {
            const cached = localStorage.getItem('sunData');
            const cachedLocation = localStorage.getItem('location');

            if (cached && cachedLocation) {
                try {
                    sunData = JSON.parse(cached);
                    // Convert string dates back to Date objects
                    sunData.sunrise = new Date(sunData.sunrise);
                    sunData.sunset = new Date(sunData.sunset);
                    sunData.solarNoon = new Date(sunData.solarNoon);
                    sunData.civilTwilightBegin = new Date(sunData.civilTwilightBegin);
                    sunData.civilTwilightEnd = new Date(sunData.civilTwilightEnd);

                    currentLocation = JSON.parse(cachedLocation);

                    // Check if data is from today
                    const cachedDate = new Date(sunData.sunrise).toDateString();
                    const today = new Date().toDateString();

                    if (cachedDate === today) {
                        updateGradient();
                        return true;
                    }
                } catch (e) {
                    console.error('Error parsing cached data:', e);
                }
            }
            return false;
        }

        // Set location to Listowel, Ontario
        function getLocation() {
            currentLocation = DEFAULT_LOCATION;
            localStorage.setItem('location', JSON.stringify(currentLocation));
            fetchSunData();
        }

        // Fetch sunrise/sunset data
        async function fetchSunData() {
            try {
                const response = await fetch(
                    `https://api.sunrise-sunset.org/json?lat=${currentLocation.lat}&lng=${currentLocation.lng}&formatted=0`
                );
                const data = await response.json();

                if (data.status === 'OK') {
                    sunData = {
                        sunrise: new Date(data.results.sunrise),
                        sunset: new Date(data.results.sunset),
                        solarNoon: new Date(data.results.solar_noon),
                        civilTwilightBegin: new Date(data.results.civil_twilight_begin),
                        civilTwilightEnd: new Date(data.results.civil_twilight_end)
                    };

                    // Cache sun data
                    localStorage.setItem('sunData', JSON.stringify(sunData));

                    updateGradient();

                    // Update every minute
                    setInterval(() => {
                        updateGradient();
                    }, 60000);
                } else {
                    throw new Error('Failed to fetch sun data');
                }
            } catch (error) {
                console.error('Error fetching sun data:', error);
            }
        }

        // Calculate current phase of day
        function getCurrentPhase() {
            if (!sunData) return 'night';

            const now = new Date();
            const currentTime = now.getTime();

            const { sunrise, sunset, civilTwilightBegin, civilTwilightEnd } = sunData;

            const dawnStart = civilTwilightBegin.getTime();
            const dawnEnd = sunrise.getTime() - (30 * 60 * 1000);
            const sunriseStart = dawnEnd;
            const sunriseEnd = sunrise.getTime() + (30 * 60 * 1000);
            const morningEnd = sunrise.getTime() + (3 * 60 * 60 * 1000);

            const afternoonStart = sunset.getTime() - (4 * 60 * 60 * 1000);
            const goldenHourStart = sunset.getTime() - (90 * 60 * 1000);
            const sunsetStart = sunset.getTime() - (30 * 60 * 1000);
            const sunsetEnd = sunset.getTime() + (30 * 60 * 1000);
            const duskEnd = civilTwilightEnd.getTime();

            if (currentTime >= dawnStart && currentTime < dawnEnd) {
                return 'dawn';
            } else if (currentTime >= sunriseStart && currentTime < sunriseEnd) {
                return 'sunrise';
            } else if (currentTime >= sunriseEnd && currentTime < morningEnd) {
                return 'morning';
            } else if (currentTime >= morningEnd && currentTime < afternoonStart) {
                return 'midday';
            } else if (currentTime >= afternoonStart && currentTime < goldenHourStart) {
                return 'afternoon';
            } else if (currentTime >= goldenHourStart && currentTime < sunsetStart) {
                return 'goldenHour';
            } else if (currentTime >= sunsetStart && currentTime < sunsetEnd) {
                return 'sunset';
            } else if (currentTime >= sunsetEnd && currentTime < duskEnd) {
                return 'dusk';
            } else {
                return 'night';
            }
        }

        // Hardy concert countdown
        const concertDate = new Date('2026-02-07T19:00:00'); // Feb 7, 2026 at 7:00 PM

        // Update countdown display
        function updateClock() {
            const now = new Date();
            const diff = concertDate - now;

            if (diff <= 0) {
                // Concert time!
                const clockElement = document.getElementById('clock');
                if (clockElement) {
                    clockElement.textContent = `IT'S TIME`;
                }
                return;
            }

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);

            const clockElement = document.getElementById('clock');
            if (clockElement) {
                const d = String(days).padStart(2, '0');
                const h = String(hours).padStart(2, '0');
                const m = String(minutes).padStart(2, '0');
                const s = String(seconds).padStart(2, '0');
                clockElement.textContent = `${d}       ${h}       ${m}       ${s}`;
            }
        }

        // Start countdown updates
        setInterval(updateClock, 1000);
        updateClock(); // Initial call

        // Calculate dynamic font weight based on solar position
        function calculateFontWeight() {
            if (!sunData) return 200;

            const now = new Date();
            const currentTime = now.getTime();
            const sunrise = sunData.sunrise.getTime();
            const sunset = sunData.sunset.getTime();
            const solarNoon = sunData.solarNoon.getTime();

            // Night: weight 100-200
            if (currentTime < sunrise || currentTime > sunset) {
                return 200;
            }

            // Day: transition from 200 (sunrise) to 400 (noon) to 200 (sunset)
            if (currentTime <= solarNoon) {
                // Morning: 200 → 400
                const progress = (currentTime - sunrise) / (solarNoon - sunrise);
                return 200 + (progress * 200);
            } else {
                // Afternoon: 400 → 200
                const progress = (currentTime - solarNoon) / (sunset - solarNoon);
                return 400 - (progress * 200);
            }
        }

        // Update gradient based on current phase (Animated Liquid Gradient)
        function updateGradient() {
            const phase = getCurrentPhase();
            const gradient = GRADIENTS[phase];

            if (gradient) {
                // Update CSS custom properties for the 4 animated gradient circles
                document.body.style.setProperty('--color-1', gradient.colors[0]);
                document.body.style.setProperty('--color-2', gradient.colors[1]);
                document.body.style.setProperty('--color-3', gradient.colors[2]);
                document.body.style.setProperty('--color-4', gradient.colors[3]);

                // Update text colors
                const title = document.querySelector('.title');
                const tourName = document.querySelector('.tour-name');
                const subtitle = document.querySelector('.subtitle');
                const venue = document.querySelector('.venue');
                const supporting = document.querySelector('.supporting');
                const tagline = document.querySelector('.tagline');
                const labels = document.querySelector('.countdown-labels');
                const phaseElement = document.getElementById('phase');

                if (title) {
                    title.style.color = gradient.textColor;
                }

                if (tourName) {
                    tourName.style.color = gradient.textColor;
                }

                if (subtitle) {
                    subtitle.style.color = gradient.textColor;
                }

                if (venue) {
                    venue.style.color = gradient.textColor;
                }

                if (supporting) {
                    supporting.style.color = 'rgba(255, 255, 255, 0.6)';
                }

                if (tagline) {
                    tagline.style.color = gradient.taglineColor;
                }

                if (labels) {
                    labels.style.color = gradient.taglineColor;
                }

                // Update phase indicator
                const phaseNames = {
                    night: 'night',
                    dawn: 'dawn',
                    sunrise: 'sunrise',
                    morning: 'morning',
                    midday: 'midday',
                    afternoon: 'afternoon',
                    goldenHour: 'golden hour',
                    sunset: 'sunset',
                    dusk: 'dusk'
                };

                if (phaseElement) {
                    phaseElement.textContent = phaseNames[phase] || '';
                    phaseElement.style.color = gradient.phaseColor;
                }

                // Apply faster transition on first load
                if (isFirstLoad) {
                    document.body.classList.add('loaded');
                    isFirstLoad = false;
                }
            }
        }

        // Mouse tracking for interactive gradient movement
        let mouseX = 0;
        let mouseY = 0;
        let targetX = 0;
        let targetY = 0;
        let currentX = 0;
        let currentY = 0;
        let isMouseActive = false;
        let inactivityTimeout = null;

        // Smooth interpolation (lerp)
        function lerp(start, end, factor) {
            return start + (end - start) * factor;
        }

        // Track mouse movement
        document.addEventListener('mousemove', (e) => {
            // Normalize mouse position to -1 to 1 range
            mouseX = (e.clientX / window.innerWidth) * 2 - 1;
            mouseY = (e.clientY / window.innerHeight) * 2 - 1;

            // Tighter, more refined swirling effect
            targetX = mouseX * 8; // 8% max offset for subtle luxury movement
            targetY = mouseY * 8;

            isMouseActive = true;

            // Reset inactivity timeout
            clearTimeout(inactivityTimeout);
            inactivityTimeout = setTimeout(() => {
                isMouseActive = false;
            }, 2000); // 2 seconds of no movement = drift back to center
        });

        // Mouse leaves viewport = drift back to center
        document.addEventListener('mouseleave', () => {
            isMouseActive = false;
            targetX = 0;
            targetY = 0;
        });

        // Animation loop for smooth gradient movement
        function animateGradient() {
            // If mouse is inactive, drift back to center
            if (!isMouseActive) {
                targetX = lerp(targetX, 0, 0.03); // Drift back
                targetY = lerp(targetY, 0, 0.03);
            }

            // Smooth interpolation with inertia - increased for more responsiveness
            currentX = lerp(currentX, targetX, 0.15); // 15% interpolation = more responsive
            currentY = lerp(currentY, targetY, 0.15);

            // Apply transform to gradient background
            const gradientLayer = document.body;
            if (gradientLayer) {
                gradientLayer.style.setProperty('--offset-x', `${currentX}%`);
                gradientLayer.style.setProperty('--offset-y', `${currentY}%`);
            }

            requestAnimationFrame(animateGradient);
        }

        // Start animation loop
        animateGradient();

        // Initialize
        const hasCachedData = checkCachedData();

        if (!hasCachedData) {
            getLocation();
        } else {
            // Still fetch fresh data in background
            getLocation();
            // Set up interval for updates
            setInterval(() => {
                updateGradient();
            }, 60000);
        }
    </script>
</body>
</html>
